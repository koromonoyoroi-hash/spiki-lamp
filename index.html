<!doctype html>
<html lang="ja">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#fff8e8" /><title>ｽﾋﾟｷﾗﾝﾌﾟ Web版</title><link rel="stylesheet" href="styles.css?v=2" /><link rel="stylesheet" href="overrides.css?v=79" /></head>
<body>
<main class="app-shell">
<button id="fullscreenBtn" class="fullscreen-btn" type="button">全画面</button>
  <section class="main-grid"><section class="visual-column"><section class="result-panel panel"><img id="resultImage" src="assets/img/抽選中.png" alt="抽選中" /></section><section class="lamp-card panel" aria-live="polite"><div class="lamp-rim"><div id="lampCore" class="lamp-core"></div></div><div id="lampLabel" class="lamp-label">抽選待機中</div><div id="lampSub" class="lamp-sub">ゲーム開始後に時間抽選</div><div class="meter"><span id="progressBar"></span></div><div class="lamp-foot"><span>回転数</span><strong id="spins">0</strong><span class="muted">/</span><span id="missed">4秒抽選</span></div></section></section>
  <section class="control-card panel"><div class="timer"><span id="timeLeft">60:00</span><small>残り時間</small></div><button id="consumeBtn" class="bonus-btn" disabled>大当たりを消化</button><div class="stats-row"><div><span>現在玉数</span><strong><span id="balls">0</span><small>個</small></strong></div></div><div class="detail-stats"><div><span>遊戯中スペック:</span><strong id="playingSpec">甘</strong><span></span></div><div><span>現在回転数:</span><strong id="currentSpins">0</strong><span>回</span></div><div><span>通常時総回転数:</span><strong id="normalSpins">0</strong><span>回</span></div><div><span>現在総初当たり回数:</span><strong id="initialHits">0</strong><span>回</span></div><div><span>現在連チャン回数:</span><strong id="chainCount">0</strong><span>回</span></div><div><span>現在獲得出玉:</span><strong id="currentPayout">0</strong><span>個</span></div></div><div class="control-actions"><button id="mainSpecBtn" class="ghost-btn compact">途中終了</button><button id="settingsBtn" class="ghost-btn compact">設定</button></div><a class="creator-link" href="https://x.com/koromonoyoroi" target="_blank" rel="noopener noreferrer">制作者：コロモノヨロイ</a></section>
  <section class="panel history-card"><div class="section-heading"><span>大当たり履歴</span><span id="hitCount">0回</span></div><div id="history" class="history-list"><div class="empty-state">まだ大当たり履歴はありません</div></div></section></section>
</main>
<div id="startupSpecModal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card spec-modal-card"><p class="eyebrow">SELECT MACHINE</p><h2>スペックを選択</h2><p class="modal-copy">遊びたいスペックを選んでください。</p><div id="specCards" class="spec-cards"></div><select id="specSelectMain" class="hidden"><option value="超甘">超甘</option><option value="甘">甘</option><option value="マックス">マックス</option></select><button id="applySpec" class="primary-btn spec-start-btn">▶ このスペックで開始</button></div></div><div id="currentSpecModal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card spec-modal-card"><div class="modal-header"><div><p class="eyebrow">CURRENT SPEC</p><h2>遊戯中スペック</h2></div><button class="close-btn current-spec-close" data-close>戻る</button></div><div id="currentSpecDetails" class="spec-cards"></div></div></div>
<div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><div class="modal-header"><div><p class="eyebrow">GAME SETTINGS</p><h2>設定</h2></div><button class="close-btn" data-close>×</button></div><div class="setting-grid"><label>ユーザー名<input id="userNameInput" type="text" maxlength="20" value="ｽﾋﾟｷ" /></label><label><div class="setting-label-row"><span>ランプ音量</span></div><div class="setting-control-row"><div class="setting-slider-wrap"><span id="lampVolumeValue">65%</span><input id="lampVolumeInput" type="range" min="0" max="100" value="65" /></div><button id="testLampSoundBtn" class="ghost-btn" type="button">ランプ音確認</button></div></label><label><div class="setting-label-row"><span>ランプ以外の音量</span></div><div class="setting-control-row"><div class="setting-slider-wrap"><span id="volumeValue">65%</span><input id="volumeInput" type="range" min="0" max="100" value="65" /></div><button id="testOtherSoundBtn" class="ghost-btn" type="button">ランプ以外音確認</button></div></label></div><div class="settings-links"><button id="readmeBtn" class="ghost-btn" type="button">Readmeを開く</button><button id="creatorTwitterBtn" class="ghost-btn" type="button">制作者Twitter（現X）</button><button id="currentSpecDetailBtn" class="ghost-btn" type="button">遊戯中スペック詳細確認</button></div><button id="saveSettings" class="primary-btn">設定を保存</button></div></div>
<div id="resultModal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card result-card"><p class="eyebrow">SESSION RESULT</p><h2>ゲーム終了</h2><p id="resultLead"></p><div id="resultStats" class="result-stats"></div><p id="serverNotice" class="server-notice"></p><div class="result-actions"><button id="downloadBtn" class="primary-btn">CSVで保存</button><button id="shareBtn" class="ghost-btn">Twitter（現X）で共有</button><button id="resultSpecBtn" class="ghost-btn">スペック選択</button></div></div></div>
<script src="app.js?v=65"></script></body></html>
